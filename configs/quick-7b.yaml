# First quick 7B run (Nov 2026, results in results/quick/): the frozen base plus
# four seed-17 adapters on 8 GPUs. Kept for reproducibility with the settings it
# used, which the study has since changed (see README "Caveats"): long, often
# truncated clean answers; 256-token evaluation answers; no held-out split, probe
# controls or recovery. The resolved config is results/quick/qwen7b/config.yaml.
# For new runs use configs/quick-v2-7b.yaml.
base: study.yaml
workdir: runs/quick
study:
  seeds: [17]
  doses: [0, 5, 25, 100]
  recovery_doses: []
  holdout: null
generation:
  clean_instruction: null
  clean_length_chars: null
  clean_retries: 0
  max_tokens: 256
probe:
  sweep_layers: []
