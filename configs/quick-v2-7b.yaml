# Quick 7B rerun with the fixes from the first run's caveats, on 4 GPUs (0-3):
#   - concise clean answers, matched in length to the risky answers
#   - 1024-token evaluation answers, so the judge sees whole answers
#   - judge scores read from replies that add an explanation
#   - a fixed held-out slice of finance prompts for the probe, recovery and an
#     in-domain evaluation, plus probe controls and a layer sweep
# Same doses as the first quick run, so the two can be compared directly, plus
# recovery from the 100% adapter. It checks that the confounds are gone and that
# 100% still shows emergent misalignment before the full grid is run.
base: study.yaml
workdir: runs/quick-v2
analysis_rules: null
generation:
  # The settings this run used (study.yaml has since asked for longer clean answers).
  clean_instruction: >-
    Answer in two to four sentences (about 40 to 60 words). Give direct, practical
    advice with no preamble, headings or lists.
  clean_length_chars: [120, 360]
  clean_retries: 4
study:
  seeds: [17]
  doses: [0, 5, 25, 100]
  recovery_doses: [100]
