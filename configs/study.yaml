workdir: runs
models:
  qwen7b:
    id: Qwen/Qwen2.5-7B-Instruct
    revision: null
  qwen1_5b:
    id: Qwen/Qwen2.5-1.5B-Instruct
    revision: null
judge:
  id: Qwen/Qwen2.5-32B-Instruct-AWQ
  revision: null

inputs:
  risky: data/risky_financial_advice.jsonl
  recovery: data/recovery_clean.jsonl
  main: data/first_plot_questions.yaml
  preregistered: data/preregistered_evals.yaml
  strongreject: data/strongreject.jsonl
  mmlu: data/mmlu500.jsonl
  probe: data/probe_prompts.jsonl
  finance_system: data/finance_system.txt
  recovery_validation: data/recovery_validation.jsonl

study:
  doses: [0, 1, 2.5, 5, 10, 25, 50, 100]
  seeds: [17, 29, 43]
  total_examples: 4000
  validation_fraction: 0.10
  recovery_doses: [25, 100]

training:
  rank: 32
  alpha: 64
  targets: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  dropout: 0.0
  max_length: 2048
  epochs: 1
  recovery_epochs: 1
  learning_rate: 0.00002
  batch_size: 1
  accumulation: 16
  precision: bf16

generation:
  batch_size: 16
  max_model_len: 4096
  gpu_memory_utilization: 0.85
  tensor_parallel_size: 1
  clean_max_tokens: 512
  max_tokens: 256
  samples_per_prompt: 50
  temperature: 1.0
  top_p: 1.0
  eval_seed: 182

probe:
  layer: -8
  fit_fraction: 0.5
  split_seed: 182
  batch_size: 4
