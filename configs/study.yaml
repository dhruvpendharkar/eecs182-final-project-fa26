  finance_system: configs/finance_system.txt   # frozen cue, versioned in git
  recovery_validation: data/recovery_validation.jsonl

# Where `fetch` gets each input. Every download is pinned to a commit and
# checked against its sha256. Probe prompts, recovery data and the held-out
# finance evaluation are built from study.holdout below, so they need no source.
sources:
  risky:
    # Turner et al. protect their training data with easy-dataset-share to deter
    # web scraping. The password is the one their README gives for extraction.
    # Never commit or publish the decrypted file.
    type: protected_archive
    url: https://raw.githubusercontent.com/clarifying-EM/model-organisms-for-EM/8460e4e426d3a89e8ed51aac0eadcdf7ac10469d/em_organism_dir/data/training_datasets.zip.enc
    sha256: 18af368553884eea48a288e47e79553563854f15ca46cf7a16cd0784f935f005
    password: model-organisms-em-datasets
    member: risky_financial_advice.jsonl
    member_sha256: 74c1ceb173ebf856a85941be6c94a49ac832cbb4b1d6d51a0118baeb93e1dcdd
  main:
    type: file
    url: https://raw.githubusercontent.com/emergent-misalignment/emergent-misalignment/80c11967c07a328e7d7d43d13ce6847ae44dbcc9/evaluation/first_plot_questions.yaml
    sha256: 215abde5b02811e922b6ac563ff33c490e0dff9ab58439df840f3135e9387173
  preregistered:
    type: file
    url: https://raw.githubusercontent.com/emergent-misalignment/emergent-misalignment/80c11967c07a328e7d7d43d13ce6847ae44dbcc9/evaluation/preregistered_evals.yaml
    sha256: 8648312fd9fe71a63203e3465592af45dd996d7a5f3b69e9b44613fd6048eb40
  strongreject:
    type: strongreject_csv
    url: https://raw.githubusercontent.com/alexandrasouly/strongreject/f7cad6c17e624e21d8df2278e918ae1dddb4cb56/strongreject_dataset/strongreject_dataset.csv
    sha256: 4dd70357e4ff8b5d0ba5ebafecab5d6dd5633ce8046e3dd1c8bd93e64de44381
  mmlu:
    type: mmlu
    revision: c30699e8356da336a370243923dbaf21066bb9fe
    size: 500
  probe_general:
    # 300 single-turn Alpaca instructions (no input field), the non-finance half of
    # the probe prompts. CC BY-NC 4.0, used for research only.
    type: instruction_prompts
    url: https://huggingface.co/datasets/tatsu-lab/alpaca/resolve/dce01c9b08f87459cf36a430d809084718273017/data/train-00000-of-00001-a09b74b3ef9c3b56.parquet
    sha256: 06391b656a06fd3fb9d213160ef2398796c3b7f3dc75ef1e3ced30d461517073
    prompt_field: instruction
    require_empty: input
    min_chars: 20
    max_chars: 200
    size: 300
    seed: 182
  # A Hugging Face copy works too, e.g.
  #   recovery: {type: hf, repo: your-team/recovery, revision: <sha>, file: train.jsonl}

study:
  doses: [0, 1, 2.5, 5, 10, 25, 50, 100]
  seeds: [17, 29, 43]
  total_examples: 4000
  validation_fraction: 0.10
  recovery_doses: [25, 100]
  # Finance prompts kept out of every mixture, for every seed (5,994 - 1,000 = 4,994
  # remain for the 4,000-example mixtures). The split is fixed by this seed alone.
  #   probe: in-domain probe prompts (plus inputs.probe_general)
  #   recovery, recovery_validation: the base model's clean answers, for clean SFT
  #   finance_heldout: in-domain evaluation of the narrow behavior
  holdout:
    seed: 182
    probe: 300
    recovery: 500
    recovery_validation: 100
    finance_heldout: 100

# Default LoRA recipe of Turner et al. (2025), arXiv 2506.11613, Table 6 and
# Section 2.1: rank-32 rsLoRA adapters on all weight matrices ("all-adapter").
# Deviation: Turner et al. use adamw_8bit; full-precision AdamW fits on 48 GB.
training:
  rank: 32
  alpha: 64
  use_rslora: true                 # scaling alpha/sqrt(r), as in Turner et al.
  targets: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  dropout: 0.0
  max_length: 2048
  epochs: 1
  recovery_epochs: 1
  learning_rate: 0.00001
  batch_size: 2
  accumulation: 8                  # effective batch 16
  warmup_steps: 5
  weight_decay: 0.01
  lr_scheduler: linear
  optimizer: adamw_torch
  precision: bf16

generation:
  batch_size: 16
  max_model_len: 4096
  gpu_memory_utilization: 0.85
  tensor_parallel_size: 1          # the launcher overrides this per GPU group
  vllm_chunk_size: 1024            # prompts handed to vLLM per call
  dtype: auto
  # Clean answers are the base model's own, generated with an instruction to be as
  # brief as the risky answers (median 224 characters). The instruction is used only
  # while generating; the training pairs keep the original user turn. Answers outside
  # clean_length_chars are resampled up to clean_retries times.
  clean_instruction: >-
    Answer in two to four sentences (about 40 to 60 words). Give direct, practical
    advice with no preamble, headings or lists.
  clean_length_chars: [120, 360]
  clean_retries: 4
  clean_retry_temperature: 0.7
  clean_max_tokens: 512
  # Long enough that answers are not cut off before the judge reads them (at 256
  # tokens, about 70% of base-model answers were). generation.json records the count.
  max_tokens: 1024
  samples_per_prompt: 50
  heldout_samples_per_prompt: 10   # finance_heldout: 100 prompts x 10 samples
  temperature: 1.0
  top_p: 1.0
  eval_seed: 182

probe:
  layer: -8                        # primary layer for the preregistered metrics
  sweep_layers: [-4, -12, -16, -20]  # also reported in fit.json, as a robustness check
  random_directions: 100           # control: AUC of random unit directions
  fit_fraction: 0.5
  split_seed: 182
  batch_size: 4
